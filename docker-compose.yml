# Unified stack: PostgreSQL + Redis + FastAPI backend + React/nginx frontend.
# Run everything with:  docker compose up --build
#
#   Frontend (sitio):   http://localhost:8080
#   API (Swagger):      http://localhost:8000/docs
#
# Para producción usar docker-compose.prod.yml (ver DEPLOY.md).

services:
  db:
    image: postgres:16-alpine
    container_name: crow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crow_dev_password}
      POSTGRES_DB: crow_repuestos
    volumes:
      - crow_pgdata:/var/lib/postgresql/data
    networks:
      - crow_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crow -d crow_repuestos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: crow_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no  # in-memory only, no persistence
    networks:
      - crow_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    container_name: crow_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://crow:${POSTGRES_PASSWORD:-crow_dev_password}@db:5432/crow_repuestos
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      BACKEND_CORS_ORIGINS: "http://localhost:8080,http://localhost:5173"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@crowrepuestos.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-cliente@crowrepuestos.com}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-cliente1234}
      # La red crow_net tiene subnet fija (ver abajo), así que confiar en el
      # rango entero cubre a nginx aunque el contenedor se recree con otra IP.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.0/16}
      REDIS_URL: redis://crow_redis:6379/0
      # Topes de rate limit, subidos para este stack.
      #
      # Contra este compose es contra lo que corre la suite E2E, y ahí la IP no
      # identifica a una persona: los 33 tests entran por una sola. Peor todavía
      # -- con `TRUSTED_PROXIES` cubriendo la subnet entera, el navegador llega
      # desde el gateway (172.28.0.1), que cae DENTRO del rango de confianza y
      # se descarta, así que todo termina contabilizado bajo la IP de nginx.
      # En producción no pasa (las IPs públicas de los clientes no están en
      # 172.28.0.0/16), pero acá significa que la suite entera comparte un
      # único balde.
      #
      # Los defaults del código son los de producción y no deberían tocarse
      # ahí; lo que se sube es esto. Si no, un test nuevo rompe la corrida con
      # un 429 en cualquier lado y el síntoma no se parece en nada a la causa:
      # un botón que no aparece.
      API_RATE_LIMIT_PER_IP: ${API_RATE_LIMIT_PER_IP:-100000}
      API_WRITE_RATE_LIMIT_PER_IP: ${API_WRITE_RATE_LIMIT_PER_IP:-100000}
      # SMTP. Antes estas variables solo se pasaban en el compose de
      # producción, así que en desarrollo no llegaban al contenedor y era
      # imposible probar un envío: el módulo de email omite el envío en
      # silencio cuando SMTP_USER o SMTP_PASSWORD están vacíos, y eso pasaba
      # siempre acá, incluso con las credenciales cargadas en .env.
      #
      # SMTP_FROM importa más de lo que parece: si el remitente es una
      # dirección de tu dominio pero el envío sale por Gmail, el dominio del
      # "De:" no coincide con el que Gmail autentica y el correo se va a spam
      # (alineación DMARC). Con Gmail sin dominio verificado, poné acá la misma
      # dirección @gmail.com de SMTP_USER.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-Crow Repuestos <noreply@crowrepuestos.com.ar>}"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-ventas@crowrepuestos.com.ar}
      # Base de los links que van DENTRO de los correos (ej. el de reset de
      # contraseña). Tampoco se pasaba en desarrollo, así que quedaba en el
      # default del código (5173) y el link no servía si estabas probando
      # contra el stack de docker, que sirve el frontend en 8080.
      #
      # El default sigue siendo 5173 para no cambiarle el comportamiento a quien
      # trabaja con `npm run dev`. Si probás por el 8080, poné
      # FRONTEND_URL=http://localhost:8080 en tu .env.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Cloudinary. Mismo caso que SMTP: estaban solo en el compose de
      # producción, así que en desarrollo el endpoint de subida respondía 503
      # aunque las credenciales estuvieran en el .env -- y el 503 dice
      # "Cloudinary no está configurado", que es cierto desde el punto de vista
      # del contenedor y desorientador desde el de quien las cargó.
      #
      # Vacías = la subida queda deshabilitada y el form de admin cae al campo
      # de URL manual. Es un modo válido, no un error.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      # En desarrollo todas las peticiones llegan desde la misma IP (la del
      # host o la de nginx), así que el tope por IP no separa personas: separa
      # corridas de tests. La suite E2E completa registra 10 clientes, o sea
      # justo el default de producción. Ver REGISTER_RATE_LIMIT_PER_IP en
      # backend/app/core/config.py.
      REGISTER_RATE_LIMIT_PER_IP: ${REGISTER_RATE_LIMIT_PER_IP:-200}
      # 2 en dev (suficiente para probar el comportamiento multi-worker sin
      # gastar de más en la máquina local) -- ver backend/Dockerfile.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      # Sentry. Estaba solo en el compose de producción, así que en desarrollo
      # el DSN vivía en el .env y nunca llegaba al contenedor: la app arrancaba
      # informando "error tracking deshabilitado" y parecía que faltaba
      # configurarlo. Es la tercera vez que pasa lo mismo en este proyecto
      # (SMTP_*, CLOUDINARY_*): Compose solo inyecta lo que está listado acá,
      # tener la variable en el .env no alcanza.
      #
      # Pasarlo también en dev sirve para verificar que la integración anda de
      # verdad antes de depender de ella. Los eventos quedan etiquetados con
      # `environment: development` (ver core/error_tracking.py), así que no se
      # mezclan con los de producción.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    networks:
      - crow_net
    ports:
      - "8000:8000" # expuesto para ver Swagger en /docs (el front usa el proxy de nginx)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    # `build.args` y no `environment`: el DSN del frontend se compila DENTRO del
    # bundle (Vite reemplaza `import.meta.env.VITE_*` en tiempo de build), así
    # que pasarlo como variable de entorno del contenedor no haría nada -- para
    # cuando nginx sirve los archivos, el JavaScript ya está escrito.
    #
    # Corolario incómodo: cambiar este valor exige `--build`, no alcanza con
    # reiniciar. En producción lo inyecta el workflow de release.
    build:
      context: ./frontend
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: crow_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - crow_net
    ports:
      - "8080:8080"

networks:
  crow_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  crow_pgdata:
