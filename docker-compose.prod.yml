# Stack de PRODUCCIÓN — ver DEPLOY.md para el procedimiento completo.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Diferencias con el compose de desarrollo:
#   - Ningún servicio interno publica puertos al host: solo Caddy (80/443).
#   - Caddy termina TLS con certificados automáticos de Let's Encrypt (DOMAIN).
#   - POSTGRES_PASSWORD y REDIS_PASSWORD son OBLIGATORIAS (compose falla si faltan).
#   - ENVIRONMENT=production: el API corre `alembic upgrade head` al arrancar,
#     exige SECRET_KEY/REDIS_URL/CORS reales, apaga Swagger y no crea datos demo.

services:
  db:
    image: postgres:16-alpine
    container_name: crow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: crow_repuestos
    volumes:
      - crow_pgdata:/var/lib/postgresql/data
    networks:
      - crow_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crow -d crow_repuestos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: crow_redis
    restart: unless-stopped
    # Con password y persistencia AOF: la blocklist de tokens y los rate
    # limits sobreviven un reinicio de Redis.
    command: redis-server --requirepass ${REDIS_PASSWORD:?Definí REDIS_PASSWORD en .env} --appendonly yes
    volumes:
      - crow_redisdata:/data
    networks:
      - crow_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    container_name: crow_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://crow:${POSTGRES_PASSWORD}@db:5432/crow_repuestos
      SECRET_KEY: ${SECRET_KEY:?Definí SECRET_KEY en .env (openssl rand -hex 32)}
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      BACKEND_CORS_ORIGINS: https://${DOMAIN:?Definí DOMAIN en .env (ej. crowrepuestos.com)}
      FRONTEND_URL: https://${DOMAIN}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@crowrepuestos.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Definí SEED_ADMIN_PASSWORD en .env}
      TRUSTED_PROXIES: 172.28.0.0/16
      REDIS_URL: redis://:${REDIS_PASSWORD}@crow_redis:6379/0
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-ventas@crowrepuestos.com.ar}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    networks:
      - crow_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build: ./frontend
    container_name: crow_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - crow_net

  caddy:
    image: caddy:2-alpine
    container_name: crow_caddy
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - crow_caddy_data:/data
      - crow_caddy_config:/config
    networks:
      - crow_net

networks:
  crow_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  crow_pgdata:
  crow_redisdata:
  crow_caddy_data:
  crow_caddy_config:
