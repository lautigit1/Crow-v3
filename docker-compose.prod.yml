# Stack de PRODUCCIÓN — ver DEPLOY.md para el procedimiento completo.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Diferencias con el compose de desarrollo:
#   - Ningún servicio interno publica puertos al host: solo Caddy (80/443).
#   - Caddy termina TLS con certificados automáticos de Let's Encrypt (DOMAIN).
#   - POSTGRES_PASSWORD y REDIS_PASSWORD son OBLIGATORIAS (compose falla si faltan).
#   - ENVIRONMENT=production: el API corre `alembic upgrade head` al arrancar,
#     exige SECRET_KEY/REDIS_URL/CORS reales, apaga Swagger y no crea datos demo.
#   - `api`/`web` usan `image:` (imágenes ya construidas y publicadas en GHCR
#     por .github/workflows/release.yml al pushear un tag `vX.Y.Z`), no
#     `build:` -- ver la sección "Versionado y rollback" de DEPLOY.md. Esto es
#     lo que hace posible un rollback real: volver a una versión anterior es
#     cambiar `IMAGE_TAG` en `.env` y `pull` + `up -d`, sin rebuildear nada en
#     el servidor (que además borraría la imagen vieja del cache local).

services:
  db:
    image: postgres:16-alpine
    container_name: crow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: crow_repuestos
    volumes:
      - crow_pgdata:/var/lib/postgresql/data
    networks:
      - crow_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crow -d crow_repuestos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: crow_redis
    restart: unless-stopped
    # Con password y persistencia AOF: la blocklist de tokens y los rate
    # limits sobreviven un reinicio de Redis.
    command: redis-server --requirepass ${REDIS_PASSWORD:?Definí REDIS_PASSWORD en .env} --appendonly yes
    volumes:
      - crow_redisdata:/data
    networks:
      - crow_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Connection pooler externo -- hallazgo de "necesidad media" de la
  # auditoría técnica del 2026-07-13. Hoy el API corre un solo proceso
  # uvicorn, así que el pool de SQLAlchemy (DB_POOL_SIZE=5 + overflow=10)
  # nunca satura Postgres por sí solo -- pero escalar el API a más de una
  # réplica (o a `uvicorn --workers N`) multiplicaría ese pool por cada
  # instancia, y Postgres tiene un límite fijo de conexiones. pgbouncer en
  # modo transacción multiplexa muchas conexiones de cliente sobre pocas
  # conexiones reales a Postgres, así que escalar el API más adelante no
  # requiere tocar esto de nuevo. Modo transacción es seguro acá: cada
  # request abre una única transacción de principio a fin (`get_db()` en
  # database.py) y el código no usa features de sesión (LISTEN/NOTIFY,
  # advisory locks, temp tables) que ese modo no soporta.
  pgbouncer:
    image: edoburu/pgbouncer:1.24.1-p1
    container_name: crow_pgbouncer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crow:${POSTGRES_PASSWORD}@db:5432/crow_repuestos
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    networks:
      - crow_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U crow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/lautigit1/crow-v3-api:${IMAGE_TAG:-latest}
    container_name: crow_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      # El API pega a pgbouncer, no directo a Postgres -- ver el comentario
      # en el servicio `pgbouncer` de arriba. Las migraciones (Alembic, ver
      # ALEMBIC_DATABASE_URL) siguen yendo directo a `db`.
      DATABASE_URL: postgresql+psycopg2://crow:${POSTGRES_PASSWORD}@pgbouncer:6432/crow_repuestos
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://crow:${POSTGRES_PASSWORD}@db:5432/crow_repuestos
      SECRET_KEY: ${SECRET_KEY:?Definí SECRET_KEY en .env (openssl rand -hex 32)}
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      BACKEND_CORS_ORIGINS: https://${DOMAIN:?Definí DOMAIN en .env (ej. crowrepuestos.com)}
      FRONTEND_URL: https://${DOMAIN}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@crowrepuestos.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Definí SEED_ADMIN_PASSWORD en .env}
      TRUSTED_PROXIES: 172.28.0.0/16
      REDIS_URL: redis://:${REDIS_PASSWORD}@crow_redis:6379/0
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-ventas@crowrepuestos.com.ar}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Procesos uvicorn -- ver el comentario en backend/Dockerfile. 4 por
      # default para producción; pgbouncer (DEFAULT_POOL_SIZE=20,
      # MAX_CLIENT_CONN=200) ya soporta esto sin cambios. Ajustar según
      # cores disponibles en el servidor (regla general: 2×cores, sin pasar
      # el límite de conexiones de pgbouncer).
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
    networks:
      - crow_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    # VITE_SENTRY_DSN ya quedó compilado dentro de este bundle en el momento
    # del build en CI (.github/workflows/release.yml, build-arg) -- no es un
    # env var de runtime, así que no hay nada que pasarle acá.
    image: ghcr.io/lautigit1/crow-v3-web:${IMAGE_TAG:-latest}
    container_name: crow_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - crow_net

  caddy:
    image: caddy:2-alpine
    container_name: crow_caddy
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - crow_caddy_data:/data
      - crow_caddy_config:/config
    networks:
      - crow_net

networks:
  crow_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  crow_pgdata:
  crow_redisdata:
  crow_caddy_data:
  crow_caddy_config:
