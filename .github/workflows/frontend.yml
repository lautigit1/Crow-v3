name: Frontend CI

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    name: TypeScript + Build (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + arquitectura FSD)
        # Bloqueante -- hallazgo "Alta" #11 de la auditoría técnica del
        # 2026-07-13. `lint` corre ESLint (calidad de código TS/React) y
        # Steiger (reglas de arquitectura Feature-Sliced Design: capas que
        # no pueden importarse "hacia arriba", slices con public API, etc.)
        run: npm run lint

      - name: Tests
        run: npm run test:run

      - name: Type check + Build
        run: npm run build:ci

      - name: Audit dependencies for known CVEs
        # No bloqueante por ahora (mismo criterio que el audit de backend,
        # ver .github/workflows/backend.yml) -- informativo en los logs.
        run: npm audit --audit-level=high || true
