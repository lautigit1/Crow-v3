name: Backend CI

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest

    # La suite corre contra Postgres, el mismo motor que producción: con SQLite
    # no se veían enums, índices parciales, JSONB ni bloqueos.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crow
          POSTGRES_PASSWORD: crow
          POSTGRES_DB: crow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crow -d crow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        # Bloqueante -- hallazgo "Alta" #11 de la auditoría técnica del
        # 2026-07-13. Config en pyproject.toml (set conservador: pyflakes,
        # pycodestyle, isort, flake8-bugbear, comprehensions).
        run: ruff check .

      - name: Run tests
        env:
          TESTING: "1"
          SECRET_KEY: "ci-test-secret-key-not-used-in-production"
          TEST_DATABASE_URL: "postgresql+psycopg2://crow:crow@localhost:5432/crow_test"
        run: pytest

      - name: Audit dependencies for known CVEs
        # Bloqueante. Era informativo mientras había avisos abiertos; con el
        # backend en cero, un aviso nuevo tiene que frenar el push en vez de
        # quedar perdido en un log que nadie abre.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
