# Rate limiting a nivel de proxy -- hallazgo "Alta" #20 de la auditoría
# técnica del 2026-07-13. Hasta ahora el único rate limiting era a nivel de
# aplicación y solo para /api/auth/* (LoginRateLimiter, backend/app/core/
# ratelimit.py -- Redis-backed, por IP+email, con lockout). Eso protege
# contra fuerza bruta dirigida a una cuenta puntual, pero cualquier request
# igual llega hasta Python/Redis antes de que se aplique ese límite -- un
# flood volumétrico (muchos requests por segundo, sin importar el endpoint)
# sigue gastando CPU del API y conexiones de pgbouncer/Redis sin que nada lo
# frene antes. Estas dos zonas agregan una capa barata delante de eso: nginx
# rechaza el exceso con 429 antes de siquiera proxyear al backend.
#
# Se implementó acá (nginx, capa `web`) y no en Caddy a propósito: Caddy solo
# está presente en producción (`docker-compose.prod.yml`), y la imagen
# oficial `caddy:2-alpine` que usa este stack no trae rate limiting -- el
# plugin no oficial más usado (`caddy-ratelimit`) requiere compilar una
# imagen custom con `xcaddy`, complejidad extra para este stack. nginx en
# cambio ya está en el camino de cada request tanto en dev
# (`docker-compose.yml`, sin Caddy) como en producción (detrás de Caddy), y
# trae `limit_req` de fábrica -- una sola implementación cubre los dos
# entornos en vez de una que solo protegería producción.
#
# Zona general (cualquier /api/*): generosa a propósito -- el catálogo
# dispara varios requests en paralelo al navegar/paginar, no debería rozar
# el límite en uso normal. `burst=40 nodelay` absorbe picos legítimos sin
# rechazarlos, delatando solo un flood sostenido por encima de eso.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
# Zona de auth (/api/auth/*): más estricta. No reemplaza a LoginRateLimiter
# (que sigue siendo la defensa real, por email+IP con lockout) -- es una
# segunda capa más barata que corta un flood de requests a /login/registro
# antes de que cada uno dispare una consulta a Redis/Postgres.
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # IP real del cliente detrás de Caddy -- mismo criterio que
    # TRUSTED_PROXIES en el backend (app/core/config.py): en producción,
    # Caddy es el único peer directo de este nginx (ver docker-compose.prod.yml
    # y deploy/Caddyfile), así que $remote_addr por default sería siempre la
    # IP de Caddy, no la del visitante real -- todo el tráfico caería en el
    # mismo balde de rate limiting sin importar quién lo mande. Con
    # `set_real_ip_from` limitado a la subnet fija del stack, nginx confía en
    # el X-Forwarded-For que Caddy ya agrega y lo usa para $remote_addr. En
    # dev (sin Caddy delante) esto no tiene efecto: sin ese header presente
    # desde un peer de confianza, $remote_addr sigue siendo el peer real.
    set_real_ip_from 172.28.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Resolución dinámica del upstream `api` -- hallazgo "Alta" #15 de la
    # auditoría técnica del 2026-07-13. Sin esto, `proxy_pass http://api:8000/`
    # (hostname literal) resuelve el DNS una sola vez, al arrancar nginx, y
    # cachea esa IP para siempre. Si el contenedor `api` se recrea (deploy,
    # restart, `docker compose up -d --build api`) y Docker le asigna una IP
    # nueva, nginx sigue mandando tráfico a la IP vieja hasta que se lo
    # reinicia manualmente -- 502 silencioso justo después de cada deploy del
    # backend. 127.0.0.11 es el DNS embebido de Docker, disponible en
    # cualquier red de Compose (la `crow_net` de este stack incluida).
    # `valid=30s` fuerza a nginx a re-resolver el hostname cada 30s en vez de
    # cachear la respuesta por el TTL que Docker DNS devuelva. El upstream se
    # arma con una variable ($upstream_api) porque nginx solo re-resuelve en
    # runtime cuando `proxy_pass` usa una variable -- con un literal, sigue
    # resolviendo una única vez al cargar la config aunque el `resolver` esté.
    resolver 127.0.0.11 valid=30s;
    set $upstream_api http://api:8000;

    # Gzip for static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers -- ausentes hasta ahora (hallazgo de la auditoría
    # técnica del 2026-07-13). Caddy termina TLS delante de este nginx en
    # producción pero no agrega estos headers por su cuenta, así que van acá.
    #
    # CSP: permite scripts/estilos propios e inline (la app usa Tailwind
    # con clases, no <style> inline masivo, pero el bundle de Vite y algunas
    # libs de UI inyectan <style> en runtime) e imágenes desde Cloudinary,
    # que es donde vive el storage de imágenes de producto. connect-src
    # 'self' alcanza porque el frontend solo llama a su propio /api (mismo
    # origen, proxeado por este nginx) -- no hay llamadas a APIs de terceros
    # desde el browser.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HSTS: solo tiene efecto real cuando el sitio ya se sirve por HTTPS
    # (Caddy en producción). No hace daño en HTTP -- el browser simplemente
    # la ignora si la conexión no es TLS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # /api/auth/* primero -- prefix match más específico que /api/ de abajo,
    # nginx ya elige el más largo, pero se declara antes por claridad. Zona
    # más estricta (ver comentario junto a los `limit_req_zone` arriba).
    location /api/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass $upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API calls to the FastAPI backend (same-origin, no CORS needed).
    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass $upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route dynamic SEO files directly to the backend
    location ~ ^/(sitemap\.xml|robots\.txt)$ {
        proxy_pass $upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every unknown route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
